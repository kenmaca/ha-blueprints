blueprint:
  name: Motion-activated Light with external binary sensor condition
  description: >-
    Turn on a light when motion is detected and an external binary sensor is on.
    v2 (restart-safe): the turn-off is a state trigger with a `for:` duration
    instead of an in-flight wait/delay, so it survives Home Assistant restarts
    and automation reloads. The turn-off is also unconditional — it fires even
    if the condition entity (e.g. dusk) has since turned off, so lights can't
    get stuck on by a condition flip mid-cycle.
  domain: automation
  source_url: https://github.com/kenmaca/ha-blueprints/blob/main/motion_lights_condition.yml
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity: {}
    light_target:
      name: Light
      selector:
        entity: {}
    condition_entity:
      name: Binary Sensor
      selector:
        entity: {}
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
          step: 1
          mode: slider

mode: restart
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input motion_entity
    to: "on"
    id: motion_on
  - trigger: state
    entity_id: !input motion_entity
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_off

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: state
            entity_id: !input condition_entity
            state: "on"
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input light_target
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light_target
