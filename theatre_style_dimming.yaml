blueprint:
  name: Theatre-style Dimming
  description: >-
    Dim a light while media is playing and restore its previous brightness when
    playback stops or pauses.

    Dimming and restoring are driven by separate triggers, so the automation
    never holds an open run between the two. Rapidly toggling play/pause cannot
    interleave a dim with a restore, and nothing is left dangling if the
    automation is reloaded or Home Assistant restarts mid-delay.

    Every decision is re-derived from the light's current brightness rather than
    from remembered run state. Because many bulbs report a new brightness back
    to Home Assistant several seconds after being commanded, the automation
    waits for the light to confirm its level before reading it and before
    letting the next run start — so it never acts on a stale value.
  domain: automation
  source_url: https://github.com/kenmaca/ha-blueprints/blob/main/theatre_style_dimming.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    room_light:
      name: Light
      selector:
        entity:
          domain: light

    media_player:
      name: Media Player
      selector:
        entity:
          domain:
            - media_player
            - binary_sensor

    dimmed_brightness:
      name: Dimmed Brightness
      description: >-
        Brightness to dim to during playback. Cannot be 0 — a light turned fully
        off has no state left to restore from.
      default: 10
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider

    brightness_threshold:
      name: Brightness Threshold
      description: >-
        Only dim if the current brightness is above this level. Prevents
        re-dimming an already-dim light and, more importantly, prevents
        snapshotting a light this automation has already dimmed. Always treated
        as at least Dimmed Brightness + 10%, whatever is configured here.
      default: 20
      selector:
        number:
          min: 0
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

    ttd:
      name: Time-to-dim
      description: >-
        How long media must stay playing before dimming. Leaving the playing
        state during this window cancels the dim entirely.
      default: 3
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: "seconds"
          mode: slider

    ttr:
      name: Time-to-reset
      description: >-
        How long media must stay stopped/paused before restoring. Smooths over
        brief pauses and buffering; resuming during this window cancels the
        restore entirely.
      default: 10
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: "seconds"
          mode: slider

    dim_duration:
      name: Dim Duration
      description: Transition time for both dim and restore.
      default: 2
      selector:
        number:
          min: 0
          max: 30
          step: 1
          unit_of_measurement: "seconds"
          mode: slider

    fallback_brightness:
      name: Fallback Brightness
      description: >-
        Used when the light is dimmed but the saved snapshot is gone — snapshot
        scenes do not survive a Home Assistant restart. Without this the light
        would simply stay dim forever.
      default: 100
      selector:
        number:
          min: 1
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider

    settle_timeout:
      name: Light Report Delay
      description: >-
        How long the light may take to report its real brightness back to Home
        Assistant after being commanded. Many bulbs echo a new brightness
        several seconds late, and acting on that stale value is what causes a
        dim to be skipped or a wrong brightness to be saved. This is an upper
        bound, not a fixed wait — the automation continues as soon as the light
        reports. Raise it if your light is slow or polled.
      default: 10
      selector:
        number:
          min: 0
          max: 60
          step: 1
          unit_of_measurement: "seconds"
          mode: slider

    recover_on_restart:
      name: Recover after restart
      description: >-
        On Home Assistant startup, restore a light that is sitting at the dimmed
        level while media is not playing. Covers playback ending while HA was
        down. Will also brighten a light genuinely left dim by hand before the
        restart.
      default: true
      selector:
        boolean:

    dim_on_light_turn_on:
      name: Dim a light switched on mid-playback
      description: >-
        If the light is switched on by hand while media is already playing, dim
        it too. Off by default, so a light turned on mid-film stays bright until
        the next play event.
      default: false
      selector:
        boolean:

# Each run is a short, self-contained dim or restore, so runs are queued rather
# than restarted — no run is ever discarded mid-flight, and a restore can never
# execute concurrently with a dim.
mode: queued
max: 10
max_exceeded: silent

variables:
  room_light: !input room_light
  media_player: !input media_player
  dimmed_brightness: !input dimmed_brightness
  brightness_threshold: !input brightness_threshold
  dim_duration: !input dim_duration
  ttd: !input ttd
  ttr: !input ttr
  settle_timeout: !input settle_timeout

  # scene.create keys off the light, so every automation pointing at this light
  # shares one snapshot rather than each keeping a divergent copy.
  scene_entity: "scene.persistence_{{ room_light.split('.')[1] }}"

  # Never snapshot a light that is already at (or near) the dimmed level, even
  # if Brightness Threshold is misconfigured below Dimmed Brightness.
  dim_floor: "{{ [brightness_threshold, dimmed_brightness + 10] | max }}"

  # A light at or below this is treated as "we dimmed this", and is the only
  # thing this blueprint will restore. Manually brightening during playback
  # therefore opts the light out of the restore.
  dim_ceiling: "{{ dimmed_brightness + 5 }}"

  # Only wait if a fade could still be running. Normally zero; guards the case
  # where the transition outlasts the trigger's own countdown, which is how a
  # snapshot used to capture a mid-fade brightness.
  dim_settle: "{{ [0, dim_duration - ttd] | max }}"
  restore_settle: "{{ [0, dim_duration - ttr] | max }}"

triggers:
  - trigger: state
    entity_id: !input media_player
    to:
      - "playing"
      - "buffering"
      - "on"
    for:
      seconds: !input ttd
    id: media_start
    note: >-
      The countdown lives in the trigger, not in a delay. Pausing during the
      window cancels this trigger outright, so a stale dim can never land on top
      of a restore that has already run.

  - trigger: state
    entity_id: !input media_player
    to:
      - "paused"
      - "idle"
      - "off"
      - "standby"
      - "unavailable"
      - "unknown"
    for:
      seconds: !input ttr
    id: media_stop
    note: >-
      Resuming during the window cancels this trigger, so a restore can never
      fire after playback has already picked back up.

  - trigger: state
    entity_id: !input room_light
    to: "on"
    for:
      seconds: !input ttd
    id: light_on
    enabled: !input dim_on_light_turn_on
    note: >-
      Only fires on a genuine off -> on transition. Restoring brightness changes
      an attribute, not the state, so this cannot feed back into itself.

  - trigger: homeassistant
    event: start
    id: restart_recovery
    enabled: !input recover_on_restart

actions:
  - choose:
      - alias: "Playback started — snapshot and dim"
        conditions:
          - condition: trigger
            id:
              - media_start
              - light_on
        sequence:
          - alias: "Let any in-flight fade finish before reading brightness"
            delay: "{{ dim_settle | float }}"
          - alias: "Wait for the light to report a bright level, in case it is still echoing a stale one"
            wait_template: >-
              {{ is_state(room_light, 'on')
                 and ((state_attr(room_light, 'brightness') | int(0)) / 2.55) > dim_floor | float }}
            timeout: "{{ settle_timeout | float }}"
            continue_on_timeout: true
            note: >-
              A bulb often echoes its new brightness seconds after being
              commanded. Reading the attribute immediately can return the value
              from before the last restore, which used to abort this branch and
              leave the light bright for the rest of playback. Resolves the
              instant the light reports; the timeout only bounds a light that
              is genuinely dim or off.
          - alias: "Media is still playing"
            condition: template
            value_template: >-
              {{ states(media_player) in ['playing', 'buffering', 'on'] }}
          - alias: "The light is on and bright enough to be worth dimming"
            condition: template
            value_template: >-
              {{ is_state(room_light, 'on')
                 and ((state_attr(room_light, 'brightness') | int(0)) / 2.55) > dim_floor | float }}
          - action: scene.create
            data:
              scene_id: "persistence_{{ room_light.split('.')[1] }}"
              snapshot_entities: !input room_light
          - action: light.turn_on
            target:
              entity_id: !input room_light
            data:
              brightness_pct: !input dimmed_brightness
              transition: !input dim_duration
          - alias: "Hold the run open until the light confirms it is dim"
            wait_template: >-
              {{ not is_state(room_light, 'on')
                 or ((state_attr(room_light, 'brightness') | int(0)) / 2.55) <= dim_ceiling | float }}
            timeout: "{{ (dim_duration + settle_timeout) | float }}"
            continue_on_timeout: true
            note: >-
              Queued mode plus this wait means the next run cannot start until
              the light has reported the result of this one, so no run ever
              reads a brightness that is about to change.

      - alias: "Playback stopped — restore, or fall back if the snapshot is gone"
        conditions:
          - condition: trigger
            id:
              - media_stop
              - restart_recovery
        sequence:
          - alias: "Let any in-flight fade finish before reading brightness"
            delay: "{{ restore_settle | float }}"
          - alias: "Wait for the light to report the dimmed level, in case it is still echoing a stale one"
            wait_template: >-
              {{ not is_state(room_light, 'on')
                 or ((state_attr(room_light, 'brightness') | int(0)) / 2.55) <= dim_ceiling | float }}
            timeout: "{{ settle_timeout | float }}"
            continue_on_timeout: true
            note: >-
              Mirror of the dim branch. Without it, a restore fired shortly
              after a dim could read the pre-dim brightness, decide the light
              was never dimmed, and leave it dim indefinitely.
          - alias: "Media is still not playing"
            condition: template
            value_template: >-
              {{ states(media_player) not in ['playing', 'buffering', 'on'] }}
          - alias: "Only restore a light that is on and still sitting at the dimmed level"
            condition: template
            value_template: >-
              {{ is_state(room_light, 'on')
                 and ((state_attr(room_light, 'brightness') | int(0)) / 2.55) <= dim_ceiling | float }}
          - choose:
              - alias: "Snapshot exists — restore it"
                conditions:
                  - condition: template
                    value_template: "{{ state_attr(scene_entity, 'entity_id') is not none }}"
                sequence:
                  - action: scene.turn_on
                    target:
                      entity_id: "{{ scene_entity }}"
                    data:
                      transition: !input dim_duration
            default:
              - alias: "Snapshot lost (typically a HA restart) — use the fallback"
                action: light.turn_on
                target:
                  entity_id: !input room_light
                data:
                  brightness_pct: !input fallback_brightness
                  transition: !input dim_duration
          - alias: "Hold the run open until the light confirms it is no longer dim"
            wait_template: >-
              {{ not is_state(room_light, 'on')
                 or ((state_attr(room_light, 'brightness') | int(0)) / 2.55) > dim_ceiling | float }}
            timeout: "{{ (dim_duration + settle_timeout) | float }}"
            continue_on_timeout: true
            note: >-
              Keeps a queued dim from starting while the light is still
              reporting the old dimmed value — the exact case that used to
              abort the dim and leave the light bright for the rest of playback.
