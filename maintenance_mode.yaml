blueprint:
  name: "Maintenance Mode (forced light state)"
  description: >-
    Keep a set of lights on while a robot vacuum or mop is cleaning, then turn
    off again the ones this automation switched on once cleaning stops.

    Restart-safe. There is no loop, no delay and no in-memory scene, so nothing
    is left dangling if Home Assistant restarts or the automation reloads
    mid-clean. Every run is a single instantaneous step:

    - Cleaning starts, a re-check entity changes, or a managed light is
      switched off while cleaning: each managed light that is off is added to
      the Restore list, then turned on.

    - Cleaning stops (or the cleaning sensor has been unavailable for 5
      minutes): every light in the Restore list is turned off and the list is
      cleared.

    - Home Assistant starts: both checks run against the current state, so a
      restart mid-clean resumes, and a clean that ended while HA was down is
      still tidied up.

    The Restore list is an input_text helper, so it survives restarts, which a
    scene.create snapshot cannot do. A light that was already on when
    cleaning started, and stayed on, is never touched at the end.
  domain: automation
  source_url: https://github.com/kenmaca/ha-blueprints/blob/main/maintenance_mode.yaml
  homeassistant:
    min_version: "2024.10.0"
  input:
    cleaning_sensor:
      name: Cleaning sensor
      description: Binary sensor that is on while the robot is cleaning.
      selector:
        entity:
          domain: binary_sensor
    lights:
      name: Lights to keep on
      selector:
        entity:
          domain: light
          multiple: true
    force_conditions:
      name: Only while
      description: >-
        Optional. The lights are forced on only while all of these conditions pass.
        Leave empty to always force the lights on while cleaning.
      default: []
      selector:
        condition: {}
    recheck_entities:
      name: Re-check when these change
      description: >-
        Optional. Any state change of these entities re-evaluates "Only while", so the
        lights come on part-way through a clean when the conditions start passing.
        List every entity your conditions read.
      default: []
      selector:
        entity:
          multiple: true
    restore_helper:
      name: Restore list
      description: >-
        An input_text helper (max length 255) used only by this automation. It
        records which lights this automation switched on so they can be
        switched off again, even across a restart. Give each automation its
        own helper.
      selector:
        entity:
          domain: input_text

# Each run is instantaneous, so runs are queued rather than restarted: no run
# is discarded mid-flight, and Restore-list updates never race each other.
mode: queued
max: 10
max_exceeded: silent

variables:
  cleaning_sensor: !input cleaning_sensor
  lights: !input lights
  restore_helper: !input restore_helper

triggers:
  - trigger: state
    entity_id: !input cleaning_sensor
    to: "on"
    id: cleaning_started
  - trigger: state
    entity_id: !input cleaning_sensor
    to: "off"
    id: cleaning_stopped
  - trigger: state
    entity_id: !input cleaning_sensor
    to:
      - unavailable
      - unknown
    for:
      minutes: 5
    id: cleaning_stopped
    note: >-
      If the robot integration drops out mid-clean, treat it as stopped once
      it has been gone for 5 minutes rather than holding the lights on
      indefinitely. A shorter blip is ignored.
  - trigger: state
    entity_id: !input lights
    to: "off"
    id: light_turned_off
    note: >-
      Replaces the old 60-second re-assert loop: a motion automation or a
      person switching a managed light off mid-clean turns it straight back
      on.
  - trigger: state
    entity_id: !input recheck_entities
    to: ~
    id: recheck
    note: >-
      Any state change (attributes ignored), not just "on": a Not condition
      starts passing when an entity turns off.
  - trigger: homeassistant
    event: start
    id: startup

actions:
  # Only inputs are read here (from the automation-level block above), never
  # a sibling key of this block.
  - variables:
      cleaning: "{{ is_state(cleaning_sensor, 'on') }}"
      stopped: "{{ is_state(cleaning_sensor, 'off') }}"
      recorded: >-
        {{ states(restore_helper).split(',') | map('trim')
           | select('match', 'light\.') | list }}
  - choose:
      - alias: "Cleaning and conditions met — record and turn on the managed lights that are off"
        conditions:
          - condition: trigger
            id:
              - cleaning_started
              - light_turned_off
              - recheck
              - startup
          - condition: template
            value_template: "{{ cleaning }}"
          - condition: and
            conditions: !input force_conditions
        sequence:
          - variables:
              to_force: "{{ lights | select('is_state', 'off') | list }}"
          - condition: template
            value_template: "{{ to_force | count > 0 }}"
          # Record before switching on: if HA stops between the two steps, the
          # worst case is turning off a light that is already off.
          - action: input_text.set_value
            target:
              entity_id: !input restore_helper
            data:
              value: "{{ (recorded + to_force) | unique | join(',') }}"
          - action: light.turn_on
            target:
              entity_id: "{{ to_force }}"
      - alias: "Cleaning over — turn off the lights this automation switched on"
        conditions:
          - condition: or
            conditions:
              - condition: and
                conditions:
                  - condition: trigger
                    id: cleaning_stopped
                  - condition: template
                    value_template: "{{ not cleaning }}"
              - condition: and
                conditions:
                  - condition: trigger
                    id: startup
                  - condition: template
                    value_template: "{{ stopped }}"
          - condition: template
            value_template: "{{ recorded | count > 0 }}"
        sequence:
          - action: light.turn_off
            target:
              entity_id: "{{ recorded }}"
          - action: input_text.set_value
            target:
              entity_id: !input restore_helper
            data:
              value: ""
