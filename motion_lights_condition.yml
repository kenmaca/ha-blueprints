blueprint:
  name: Motion-activated Light with external binary sensor condition
  description: >-
    Turn on a light when motion is detected and an external binary sensor is
    on, and turn it off once motion has been clear for the wait time.

    Turning on and turning off are driven by separate triggers, so the
    automation never holds an open run between the two. Nothing is left
    dangling if the automation is reloaded, restarted, or interrupted
    mid-delay. The binary sensor gates only the turn-on branch — the light
    still turns off if that sensor goes off in the meantime.

    Optional keep-on sensors let two automations share one light without
    switching it off from under each other. They veto the turn-off while they
    are on, and re-run the off-check when they clear, so the light is never
    left stranded on.
  domain: automation
  source_url: https://github.com/kenmaca/ha-blueprints/blob/main/motion_lights_condition.yml
  homeassistant:
    min_version: "2024.10.0"
  input:
    motion_entity:
      name: Motion Sensor
      selector:
        entity:
    light_target:
      name: Light
      selector:
        entity:
    condition_entity:
      name: Binary Sensor
      selector:
        entity:
    no_motion_wait:
      name: Wait time
      description: Time to leave the light on after last motion is detected
      default: 120
      selector:
        number:
          min: 0
          max: 3600
          unit_of_measurement: seconds
    hold_entities:
      name: Keep-on sensors
      description: >-
        Optional. While any of these entities is on, this automation will not
        turn the light off. When the last one clears, the off-check runs again
        after the wait time — so the light still turns off, it just waits for
        the other occupancy source to release it.

        Point this at the motion sensor of any other automation that shares
        this light. Set it on both automations, each naming the other's sensor.
      default: []
      selector:
        entity:
          multiple: true
    recover_on_restart:
      name: Recover after restart
      description: >-
        On Home Assistant startup, turn the light off if the motion sensor is
        clear. Covers the case where motion ended while HA was down, but will
        also turn off a light that was switched on by hand just before the
        restart.
      default: false
      selector:
        boolean:

# Each run is instantaneous (a single turn_on or turn_off), so runs are queued
# rather than restarted — no run is ever discarded mid-flight.
mode: queued
max: 10
max_exceeded: silent

variables:
  hold_entities: !input hold_entities

triggers:
  - trigger: state
    entity_id: !input motion_entity
    to: "on"
    id: motion_start
  - trigger: state
    entity_id: !input motion_entity
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: motion_end
    note: >-
      The wait lives in the trigger, not in a delay. Motion returning during
      the wait cancels this trigger, and the countdown is owned by the trigger
      engine instead of an in-flight automation run.
  - trigger: state
    entity_id: !input hold_entities
    to: "off"
    for:
      seconds: !input no_motion_wait
    id: hold_released
    note: >-
      A keep-on sensor releasing is a second chance to turn the light off. The
      motion sensor's own off trigger may have already fired and been vetoed
      while this sensor was on, and it will not fire again — without this
      trigger the light would stay on indefinitely.
  - trigger: homeassistant
    event: start
    id: restart_recovery
    enabled: !input recover_on_restart

actions:
  - choose:
      - alias: "Motion started and the binary sensor is on — turn on the light"
        conditions:
          - condition: trigger
            id: motion_start
          - condition: state
            entity_id: !input condition_entity
            state: "on"
        sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: !input light_target
      - alias: "Motion clear and nothing holding the light — turn off the light"
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: motion_end
              - condition: trigger
                id: hold_released
          - condition: state
            entity_id: !input motion_entity
            state: "off"
          - condition: template
            value_template: >-
              {{ hold_entities | select('is_state', 'on') | list | count == 0 }}
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input light_target
      - alias: "Startup — clear a light left on across a restart"
        conditions:
          - condition: trigger
            id: restart_recovery
          - condition: state
            entity_id: !input motion_entity
            state: "off"
          - condition: template
            value_template: >-
              {{ hold_entities | select('is_state', 'on') | list | count == 0 }}
        sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: !input light_target
